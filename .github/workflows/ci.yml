name: CI

on:
  push:
    branches: [main, "zhs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests, and offline evals (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22 is the supported floor (engines); 24 also runs the node:sqlite-backed
        # D1 integration tests, which skip automatically on older runtimes.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Agent pipeline baseline snapshot gate
        run: npm run baseline:agent

      - name: Unit and security tests
        run: node --test tests/*.test.ts tests/security/*.test.ts

      - name: Offline profile eval regression gate (smoke + full)
        run: npm run eval:regression

      - name: Offline creative retrieval eval gate
        run: node scripts/creative-retrieval-eval.mjs --gate

      - name: LLM judge calibration eval gate
        run: node scripts/judge-calibration-eval.mjs --gate

      - name: Layout and asset audits, production build, SSR test
        run: npm test
